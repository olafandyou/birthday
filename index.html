<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ef">
  <meta name="description" content="A warm, year-round calendar of our family birthdays, anniversaries and special days.">
  <title>Our Family Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff7ef; --surface: #fffdfb; --ink: #39271e; --muted: #806d62;
      --line: #f0dfd1; --accent: #c34d26; --accent-2: #a83c67;
      --tint: #fbe8d9; --shadow: 0 16px 44px #5a2e1710;
      --radius: 22px;
      font-family: "DM Sans", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#191411; --surface:#261e19; --ink:#f8eee6; --muted:#c0a99a; --line:#46372e; --accent:#ff9b68; --accent-2:#f08bad; --tint:#38271e; --shadow:0 16px 44px #0003; }
    }
    :root[data-theme="dark"] { --bg:#191411; --surface:#261e19; --ink:#f8eee6; --muted:#c0a99a; --line:#46372e; --accent:#ff9b68; --accent-2:#f08bad; --tint:#38271e; --shadow:0 16px 44px #0003; color-scheme:dark; }
    :root[data-theme="light"] { color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); line-height:1.55; }
    button { color:inherit; font:inherit; }
    .hero { position:relative; overflow:hidden; padding:clamp(42px,8vw,88px) 20px 46px; text-align:center; background:radial-gradient(ellipse at 12% 5%,#ffd8ae 0,transparent 42%),radial-gradient(ellipse at 88% 0%,#f4c5d5 0,transparent 42%),var(--bg); }
    .hero-inner { max-width:760px; margin:auto; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-size:.76rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1,h2,h3 { font-family:Fraunces,Georgia,serif; }
    h1 { margin:0; font-size:clamp(2.25rem,7vw,4.3rem); line-height:1.05; letter-spacing:-.035em; }
    .intro { margin:13px 0 0; color:var(--muted); }
    .top-actions { position:absolute; top:max(16px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right)); }
    .icon-button { min-width:44px; min-height:44px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:var(--surface); cursor:pointer; }
    .next { max-width:570px; margin:28px auto 0; padding:20px 24px; border:1px solid #ffffff80; border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); text-align:left; }
    .next-label { color:var(--muted); font-size:.72rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .next-title { margin:4px 0 1px; font:600 clamp(1.35rem,4vw,1.8rem)/1.2 Fraunces,Georgia,serif; }
    .next-detail { color:var(--muted); font-size:.9rem; }
    main { width:min(1120px,100%); margin:auto; padding:24px 20px 64px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 22px; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; }
    .filter { min-height:42px; padding:8px 16px; border:1px solid var(--line); border-radius:999px; background:var(--surface); cursor:pointer; font-size:.9rem; transition:transform .15s, background .15s; }
    .filter:hover,.icon-button:hover { transform:translateY(-1px); }
    .filter[aria-pressed="true"] { border-color:var(--ink); background:var(--ink); color:var(--bg); }
    .today-button { min-height:42px; padding:8px 14px; border:0; border-radius:999px; background:var(--tint); color:var(--ink); cursor:pointer; font-size:.88rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr)); gap:16px; align-items:start; }
    .month { padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); scroll-margin-top:16px; }
    .month.current { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent),var(--shadow); }
    .month-heading { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 12px; font-size:1.38rem; }
    .count { color:var(--muted); font:500 .75rem "DM Sans",sans-serif; }
    .event { display:grid; grid-template-columns:44px minmax(0,1fr); align-items:center; gap:12px; min-height:62px; padding:9px 8px; border-top:1px dashed var(--line); border-radius:12px; }
    .event.is-today { background:linear-gradient(90deg,var(--tint),transparent); }
    .date { display:grid; width:42px; height:42px; place-items:center; border-radius:13px; background:var(--accent); color:#fff; font:700 1.08rem Fraunces,Georgia,serif; }
    .event.anniversary .date { background:var(--accent-2); }
    .event.special .date { background:#697a3c; }
    .event-name { overflow-wrap:anywhere; font-weight:600; line-height:1.25; }
    .event-meta { margin-top:4px; color:var(--muted); font-size:.74rem; }
    .today-tag { color:var(--accent); font-weight:700; }
    .empty { padding:8px 0; color:var(--muted); font-size:.88rem; }
    footer { padding:0 20px max(28px,env(safe-area-inset-bottom)); color:var(--muted); text-align:center; font-size:.84rem; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:560px) { .hero { padding-top:76px; } .top-actions { top:max(14px,env(safe-area-inset-top)); } main { padding-inline:14px; } .toolbar { align-items:flex-start; } .filters { width:100%; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
    /* Refined editorial finish */
    :root {
      --bg:#faf6f0; --surface:#fffdfa; --ink:#2f2923; --muted:#82766a;
      --line:#e9e1d7; --accent:#a94735; --accent-2:#747e59; --tint:#f4e9dc;
      --shadow:0 18px 50px #46301b0b; --radius:18px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#171714; --surface:#22211d; --ink:#f3eee6; --muted:#b4aa9d; --line:#3c3932; --accent:#e28b73; --accent-2:#b5bd8e; --tint:#30281f; --shadow:0 18px 50px #0004; }
    }
    :root[data-theme="dark"] { --bg:#171714; --surface:#22211d; --ink:#f3eee6; --muted:#b4aa9d; --line:#3c3932; --accent:#e28b73; --accent-2:#b5bd8e; --tint:#30281f; --shadow:0 18px 50px #0004; color-scheme:dark; }
    .hero { padding:clamp(62px,9vw,112px) 20px 64px; background:radial-gradient(ellipse at 5% 5%,#ead8c6 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#edd8d5 0,transparent 34%),linear-gradient(180deg,#f4eee6 0%,var(--bg) 100%); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background:radial-gradient(ellipse at 5% 5%,#3a2d24 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#39272a 0,transparent 34%),linear-gradient(180deg,#211e19 0%,var(--bg) 100%); } }
    :root[data-theme="dark"] .hero { background:radial-gradient(ellipse at 5% 5%,#3a2d24 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#39272a 0,transparent 34%),linear-gradient(180deg,#211e19 0%,var(--bg) 100%); }
    .hero::after { content:""; position:absolute; left:50%; bottom:0; width:min(82vw,980px); height:1px; transform:translateX(-50%); background:linear-gradient(90deg,transparent,var(--line),transparent); }
    .hero-inner { position:relative; z-index:1; max-width:820px; }
    .eyebrow { letter-spacing:.21em; font-size:.68rem; }
    h1 { font-size:clamp(2.6rem,8vw,5rem); letter-spacing:-.045em; font-weight:600; }
    h1 span { display:inline-block; font-size:.58em; vertical-align:12%; filter:saturate(.72); }
    .intro { margin-top:16px; font-size:1.02rem; }
    .top-actions { z-index:2; }
    .icon-button { border-color:#ffffffa6; box-shadow:0 5px 18px #3b29120a; }
    .next { position:relative; max-width:600px; margin-top:34px; padding:24px 28px 24px 30px; border:1px solid var(--line); border-radius:14px; box-shadow:0 15px 42px #46301b12; }
    .next::before { content:""; position:absolute; left:0; top:20px; bottom:20px; width:3px; border-radius:4px; background:var(--accent); }
    .next-label { letter-spacing:.16em; font-size:.66rem; }
    .next-title { margin-top:8px; font-weight:500; font-size:clamp(1.5rem,4vw,2rem); }
    .next-detail { margin-top:6px; font-size:.84rem; }
    main { max-width:1180px; padding:32px 24px 72px; }
    .section-intro { display:flex; justify-content:space-between; align-items:end; gap:24px; margin:4px 2px 22px; }
    .section-intro .eyebrow { margin-bottom:5px; }
    .section-intro h2 { margin:0; font-size:clamp(1.7rem,4vw,2.35rem); font-weight:500; letter-spacing:-.025em; }
    .section-intro p:last-child { max-width:310px; margin:0 0 4px; color:var(--muted); font-size:.85rem; }
    .toolbar { margin-bottom:22px; padding:13px; border:1px solid var(--line); border-radius:14px; background:color-mix(in srgb,var(--surface) 82%,transparent); }
    .filter { min-height:40px; border-color:transparent; background:transparent; font-size:.83rem; }
    .filter:hover { background:var(--tint); transform:none; }
    .filter[aria-pressed="true"] { border-color:var(--ink); background:var(--ink); color:var(--bg); }
    .today-button { border:1px solid var(--line); background:var(--surface); font-size:.82rem; }
    .today-button:hover { border-color:var(--accent); }
    .month-index { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:6px; margin:0 0 22px; padding:8px; border:1px solid var(--line); border-radius:14px; background:color-mix(in srgb,var(--surface) 82%,transparent); }
    .month-link { min-width:0; min-height:38px; padding:7px 4px; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--muted); cursor:pointer; font-size:.72rem; font-weight:600; }
    .month-link:hover { border-color:var(--line); color:var(--ink); background:var(--surface); }
    .month-link[aria-current="location"] { border-color:color-mix(in srgb,var(--accent) 30%,var(--line)); background:var(--tint); color:var(--accent); }
    .grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; counter-reset:month; }
    .month { counter-increment:month; min-width:0; padding:17px 16px; border-radius:15px; box-shadow:0 8px 28px #46301b08; transition:transform .18s,box-shadow .18s,border-color .18s; }
    .month:hover { transform:translateY(-2px); box-shadow:0 16px 36px #46301b10; }
    .month.current { border-color:color-mix(in srgb,var(--accent) 52%,var(--line)); box-shadow:inset 0 3px 0 var(--accent),0 12px 32px #46301b0a; }
    .month-heading { gap:12px; margin-bottom:13px; font-size:1.42rem; font-weight:500; }
    .month-heading::before { content:counter(month,decimal-leading-zero); color:var(--accent); font:600 .67rem "DM Sans",sans-serif; letter-spacing:.1em; }
    .count { margin-left:auto; font-size:.68rem; letter-spacing:.04em; }
    .event { grid-template-columns:36px minmax(0,1fr); gap:10px; min-height:56px; padding:8px 3px; border-color:color-mix(in srgb,var(--line) 78%,transparent); border-radius:9px; }
    .event.is-today { padding-inline:8px; background:linear-gradient(100deg,var(--tint),transparent 90%); }
    .date { width:35px; height:35px; border-radius:50%; background:var(--accent); font-size:.96rem; }
    .event.anniversary .date { background:var(--accent-2); }
    .event.special .date { background:#8b7853; }
    .event-name { font-size:.91rem; font-weight:600; }
    .event-meta { margin-top:3px; font-size:.7rem; letter-spacing:.01em; }
    footer { padding-top:18px; border-top:1px solid var(--line); letter-spacing:.02em; }
    @media (max-width:1000px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:760px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .month-index { grid-template-columns:repeat(6,minmax(0,1fr)); } }
    @media (max-width:650px) { .hero { padding-top:82px; } main { padding:27px 16px 56px; } .section-intro { display:block; } .section-intro p:last-child { margin-top:7px; } .toolbar { align-items:stretch; padding:10px; } .filters { width:100%; gap:4px; } .filter { padding-inline:11px; } .today-button { align-self:flex-start; } }
    @media (max-width:440px) { .grid { grid-template-columns:minmax(0,1fr); } .month-index { grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; } .month-link { font-size:.75rem; } .month { padding:18px; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="top-actions"><button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">◐</span></button></div>
    <div class="hero-inner">
      <p class="eyebrow">A year full of reasons to celebrate</p>
      <h1>Our Family Calendar</h1>
      <p class="intro">Birthdays, anniversaries, and all our special days.</p>
      <section class="next" id="next-event" aria-live="polite" aria-atomic="true"></section>
    </div>
  </header>
  <main>
    <section class="section-intro" aria-labelledby="year-title">
      <div><p class="eyebrow">Keep close to the moments</p><h2 id="year-title">The year, together</h2></div>
     
    </section>
    <nav class="month-index" id="month-index" aria-label="Jump to a month"></nav>
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter family dates">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All dates</button>
        <button class="filter" type="button" data-filter="b" aria-pressed="false">🎂 Birthdays</button>
        <button class="filter" type="button" data-filter="a" aria-pressed="false">💍 Anniversaries</button>
        <button class="filter" type="button" data-filter="s" aria-pressed="false">💖 Special days</button>
      </div>
      <button class="today-button" id="jump-today" type="button">Jump to this month ↓</button>
    </div>
    <p id="filter-status" class="sr-only" aria-live="polite"></p>
    <div class="grid" id="calendar" aria-label="Family dates by month"></div>
  </main>
  <footer>Made with love for the family <span aria-hidden="true">❤️</span></footer>
  <script>
    "use strict";
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    // [month, day, name, type] — month is 1–12; type: b=birthday, a=anniversary, s=special day.
    const events = [
      [1,15,"Kiran","b"],[2,4,"Rinku & Neetu","a"],[2,6,"Yogesh & Narmada","a"],[2,7,"Versha","a"],[2,7,"Saksham","b"],[2,17,"Dada & Daadi (Rankaushal)","a"],[2,22,"Khushi","b"],[4,22,"Pihu","b"],[4,30,"Pinku","a"],[5,12,"Pranjal","b"],[5,16,"Kiran","a"],[5,17,"Nanaa & Nani (Malviya)","a"],[6,2,"Yogesh","b"],[6,11,"Lucky, Shiv & Sanskar","b"],[6,30,"Kushuu & Kartik","s"],[7,12,"Bhupendra","b"],[7,13,"O.S Rankaushal","b"],[7,15,"H.L. Nimoriya","b"],[7,22,"Neetu","b"],[8,4,"Nandkishore Meena","b"],[9,24,"Gauri","b"],[9,25,"Rinku","b"],[9,25,"Sunder Dadi","b"],[9,27,"Pramila","b"],[10,3,"Mamta","b"],[10,7,"Srishti","b"],[10,8,"Akshay","b"],[10,11,"ML Malviya","b"],[10,15,"Narmada","b"],[10,15,"Shashwat","b"],[11,2,"Varsha","b"],[11,13,"Ashwin","b"],[11,17,"Shiv & Mamta","a"],[12,2,"Pramila & HL Nimoriya","a"],[12,15,"Pinku","b"],[12,22,"Ishaa","b"]
    ];
    const labels = { b:"Birthday", a:"Anniversary", s:"Special day" };
    const today = new Date(); today.setHours(0,0,0,0);
    const currentMonth = today.getMonth() + 1;
    const dateFor = (event, year) => new Date(year, event[0] - 1, event[1]);
    function nextOccurrence(event) {
      let date = dateFor(event, today.getFullYear());
      if (date < today) date = dateFor(event, today.getFullYear() + 1);
      return date;
    }
    function daysUntil(date) { return Math.round((date - today) / 86400000); }
    function plural(n, one, many = `${one}s`) { return `${n} ${n === 1 ? one : many}`; }
    function setText(element, text) { element.textContent = text; return element; }

    function renderNext() {
      const upcoming = events.map(event => ({ event, date: nextOccurrence(event) }))
        .sort((a,b) => a.date - b.date);
      const soonest = upcoming[0];
      const remaining = daysUntil(soonest.date);
      const sameDay = upcoming.filter(item => daysUntil(item.date) === remaining);
      const card = document.getElementById("next-event");
      const label = setText(document.createElement("div"), remaining === 0 ? "Happening today" : "Coming up next");
      label.className = "next-label";
      const title = setText(document.createElement("h2"), sameDay.map(item => item.event[2]).join(" · "));
      title.className = "next-title";
      const detail = setText(document.createElement("div"), `${sameDay.map(item => labels[item.event[3]]).join(" · ")} · ${remaining === 0 ? "Time to celebrate! 🎉" : remaining === 1 ? "Tomorrow" : `In ${remaining} days`} · ${months[soonest.event[0]-1]} ${soonest.event[1]}`);
      detail.className = "next-detail";
      card.replaceChildren(label,title,detail);
    }

    function render(filter = "all") {
      const fragment = document.createDocumentFragment();
      months.forEach((monthName, index) => {
        const month = index + 1;
        const all = events.filter(event => event[0] === month);
        const visible = all.filter(event => filter === "all" || event[3] === filter);
        const section = document.createElement("section");
        section.className = `month${month === currentMonth ? " current" : ""}`;
        section.id = `month-${month}`;
        if (month === currentMonth) section.setAttribute("aria-current", "date");
        const heading = document.createElement("h2"); heading.className = "month-heading";
        const name = document.createElement("span"); setText(name, monthName);
        const count = document.createElement("span"); count.className = "count"; setText(count, plural(all.length,"date"));
        heading.append(name,count); section.append(heading);
        if (!visible.length) {
          const empty = document.createElement("p"); empty.className = "empty";
          setText(empty, all.length ? "No dates in this category." : "No dates yet ✨"); section.append(empty);
        }
        visible.forEach(event => {
          const isToday = event[0] === currentMonth && event[1] === today.getDate();
          const row = document.createElement("article");
          row.className = `event ${event[3] === "a" ? "anniversary" : event[3] === "s" ? "special" : "birthday"}${isToday ? " is-today" : ""}`;
          const date = document.createElement("div"); date.className = "date"; date.setAttribute("aria-hidden","true"); setText(date,String(event[1]));
          const content = document.createElement("div");
          const person = document.createElement("div"); person.className = "event-name"; setText(person,event[2]);
          const meta = document.createElement("div"); meta.className = "event-meta"; setText(meta,`${labels[event[3]]}${isToday ? " · Today! 🎉" : ""}`);
          if (isToday) meta.classList.add("today-tag");
          content.append(person,meta); row.append(date,content); section.append(row);
        });
        fragment.append(section);
      });
      document.getElementById("calendar").replaceChildren(fragment);
      const category = filter === "all" ? "all family dates" : `${filter === "b" ? "birthday" : filter === "a" ? "anniversary" : "special day"} dates`;
      document.getElementById("filter-status").textContent = `Showing ${category}.`;
    }


    function renderMonthIndex() {
      const nav = document.getElementById("month-index");
      const fragment = document.createDocumentFragment();
      months.forEach((month, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "month-link";
        button.dataset.month = String(index + 1);
        button.setAttribute("aria-label", `Jump to ${month}`);
        if (index + 1 === currentMonth) button.setAttribute("aria-current", "location");
        setText(button, month.slice(0,3));
        fragment.append(button);
      });
      nav.replaceChildren(fragment);
      nav.addEventListener("click", event => {
        const button = event.target.closest("button[data-month]");
        if (!button) return;
        document.getElementById(`month-${button.dataset.month}`).scrollIntoView({
          behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"
        });
        nav.querySelectorAll(".month-link").forEach(item => item.removeAttribute("aria-current"));
        button.setAttribute("aria-current", "location");
      });
    }

    document.querySelector(".filters").addEventListener("click", event => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      document.querySelectorAll(".filter").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      render(button.dataset.filter);
    });
    document.getElementById("jump-today").addEventListener("click", () => document.getElementById(`month-${currentMonth}`).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }));
    const themeButton = document.getElementById("theme-toggle");
    function updateThemeButton() {
      const explicit = document.documentElement.dataset.theme;
      const dark = explicit ? explicit === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      themeButton.setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`);
      themeButton.title = `Switch to ${dark ? "light" : "dark"} theme`;
      themeButton.firstElementChild.textContent = dark ? "☼" : "◐";
    }
    themeButton.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = isDark ? "light" : "dark";
      try { localStorage.setItem("family-calendar-theme", document.documentElement.dataset.theme); } catch (_) {}
      updateThemeButton();
    });
    try { const saved = localStorage.getItem("family-calendar-theme"); if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved; } catch (_) {}
    updateThemeButton(); renderNext(); render(); renderMonthIndex();
  </script>
</body>
</html>
